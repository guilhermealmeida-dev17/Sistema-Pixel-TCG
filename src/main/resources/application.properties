spring.application.name=pixel-tcg-api
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pixel_tcg}
spring.datasource.username=${DB_USERNAME:pixel_tcg}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
# Adopt the pre-created local schema, then apply this project's safe migrations.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

app.jwt.secret-base64=${JWT_SECRET_BASE64}
app.jwt.issuer=pixel-tcg-api
app.jwt.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:15}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
